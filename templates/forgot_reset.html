<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>login- advanced task management</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: radial-gradient(circle at 20% 10%, #1e293b 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, #0f766e 0%, transparent 35%),
    #020617;
  color: #e5e7eb;
  animation: fadeIn 1s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.97);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.container {
  width: 420px;
  padding: 35px 32px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(14px);
  border-radius: 22px;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transition: all 0.3s ease;
}

.container:hover {
  transform: translateY(-6px);
  border-color: #38bdf8;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
}

.container h1 {
  text-align: center;
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 20px;
}

.container p {
  text-align: center;
  font-size: 14px;
  color: #9ca3af;
  margin-bottom: 18px;
}

input {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 18px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.15);
  background: rgba(255, 255, 255, 0.04);
  color: #fff;
  font-size: 14px;
  outline: none;
  transition: 0.25s;
}

input::placeholder {
  color: #6b7280;
}

input:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 10px rgba(56, 189, 248, 0.55);
  transform: scale(1.015);
}

input[readonly] {
  opacity: 0.6;
  cursor: not-allowed;
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 16px;
  font-size: 15px;
  font-weight: 700;
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  color: white;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

button::after {
  content: "";
  position: absolute;
  width: 120%;
  height: 120%;
  top: -50%;
  left: -50%;
  background: rgba(255, 255, 255, 0.25);
  transform: rotate(45deg) translateX(-100%);
  transition: transform 0.5s ease;
}

button:hover::after {
  transform: rotate(45deg) translateX(100%);
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(0, 0, 0,  0.6);
}

@media (max-width: 600px) {
  .container {
    width: 90%;
    padding: 25px;
  }
}
  </style>
</head>
<body>
<div class="container">
  <h1>Reset Password</h1>

  {% if message %}
  <p>{{ message }}</p>
  {% endif %}

  <form method="POST" action="{{ url_for('forgot_reset') }}">
    <!-- Email Input -->
    <input type="email" name="email" placeholder="Registered Email"
           value="{{ email }}" required {% if show_otp_fields %}readonly{% endif %}/>

    <!-- OTP + New Password fields only after sending OTP -->
    {% if show_otp_fields %}
      <input type="text" name="otp" placeholder="Enter OTP" required/>
      <input type="password" name="password" placeholder="New Password" required/>
      <input type="password" name="confirm_password" placeholder="Confirm Password" required/>
    {% endif %}

    <button type="submit">
      {% if show_otp_fields %}Reset Password{% else %}Send OTP{% endif %}
    </button>
  </form>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Daily Task</title>

  <style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}


body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(circle at 20% 10%, #1e293b 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, #0f766e 0%, transparent 35%),
    #020617;

  color: #e5e7eb;
}


.form-container {
  width: 100%;
  max-width: 480px;
  padding: 35px 30px;

  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);
  backdrop-filter: blur(14px);

  border-radius: 20px;

  box-shadow:
    0 10px 25px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);

  transition: all 0.3s ease;
}

.form-container:hover {
  transform: translateY(-6px);
  border-color: #38bdf8;
  box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
}

h1 {
  text-align: center;
  font-size: 26px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 25px;
}


label {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: #cbd5e1;
  margin-bottom: 6px;
}

input,
textarea {
  width: 100%;
  padding: 12px 14px;
  margin-bottom: 18px;

  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.15);

  background: rgba(255, 255, 255, 0.06);
  color: #fff;

  font-size: 14px;
  outline: none;
  transition: all 0.3s ease;
}

textarea {
  resize: none;
  height: 95px;
}


input::placeholder,
textarea::placeholder {
  color: #9ca3af;
}

input:focus,
textarea:focus {
  border-color: #38bdf8;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
  transform: scale(1.02);
}
button {
  width: 100%;
  padding: 12px;

  border: none;
  border-radius: 25px;

  font-size: 16px;
  font-weight: 700;

  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  color: #fff;

  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
button::after {
  content: "";
  position: absolute;
  width: 120%;
  height: 120%;
  top: -50%;
  left: -50%;
  background: rgba(56, 77, 238, 0.25);
  transform: rotate(45deg) translateX(-100%);
  transition: transform 0.5s ease;
}

button:hover::after {
  transform: rotate(45deg) translateX(100%);
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
}


.back-link {
  text-align: center;
  margin-top: 18px;
}

.back-link a {
  text-decoration: none;
  font-weight: 600;
  color: #38bdf8;
  transition: 0.3s;
}

.back-link a:hover {
  color: white;
  text-decoration: underline;
}

@media (max-width: 600px) {
  .form-container {
    margin: 20px;
    padding: 25px;
  }
}

  </style>
</head>

<body>

  <div class="form-container">
    <h1> Add Daily Task</h1>

    <form method="POST" action="{{ url_for('add_daily_task') }}">

      <label>Task Name</label>
      <input type="text" name="taskname" placeholder="Enter task title" required>

      <label>Description</label>
      <textarea name="description" placeholder="Task details..." required></textarea>

      <label>Date</label>
      <input type="date" name="task_date" required>

      <button type="submit"> Add Daily Task</button>

    </form>

    <div class="back-link">
      <a href="{{ url_for('welcome') }}">Back to Dashboard</a>
    </div>
  </div>

</body>
</html>

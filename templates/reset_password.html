<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>login- advanced task management</title>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;

  background:
    radial-gradient(circle at 20% 10%, #1e293b 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, #0f766e 0%, transparent 35%),
    #020617;

  color: #e5e7eb;
  animation: fadeIn 1.2s ease-in-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: scale(0.97);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.container {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.card {
  width: 400px;
  padding: 35px 30px;
  border-radius: 20px;

  background: rgba(255, 255, 255, 0.04);
  border: 1px solid rgba(255, 255, 255, 0.08);

  backdrop-filter: blur(12px);

  box-shadow:
    0 10px 25px rgba(0, 0, 0, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.05);

  animation: slideUp 1s ease forwards;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card h2 {
  text-align: center;
  font-size: 24px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 10px;
}

.info {
  text-align: center;
  font-size: 14px;
  color: #9ca3af;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 18px;

  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.15);

  background: rgba(255, 255, 255, 0.06);
  color: #fff;

  font-size: 15px;
  transition: all 0.3s ease;
}

input::placeholder {
  color: #9ca3af;
}

input:focus {
  outline: none;
  border-color: #38bdf8;
  box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
  transform: scale(1.02);
}

button {
  width: 100%;
  padding: 12px;

  border: none;
  border-radius: 12px;

  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  color: white;

  font-size: 16px;
  font-weight: bold;

  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}


button::after {
  content: "";
  position: absolute;
  width: 120%;
  height: 120%;
  top: -50%;
  left: -50%;
  background: rgba(255, 255, 255, 0.25);
  transform: rotate(45deg) translateX(-100%);
  transition: transform 0.5s ease;
}

button:hover::after {
  transform: rotate(45deg) translateX(100%);
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
}
.alert {
  padding: 10px;
  margin-bottom: 15px;
  border-radius: 10px;
  text-align: center;
  font-weight: bold;
  animation: popIn 0.5s ease;
}

.success {
  background: rgba(34, 197, 94, 0.15);
  color: #4ade80;
}

.danger {
  background: rgba(239, 68, 68, 0.15);
  color: #f87171;
}

@keyframes popIn {
  from {
    opacity: 0;
    transform: scale(0.85);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.links {
  text-align: center;
  margin-top: 15px;
}

.links a {
  text-decoration: none;
  color: #38bdf8;
  font-weight: 600;
  transition: 0.3s;
}

.links a:hover {
  color: white;
  text-decoration: underline;
}
    

  </style>
</head>
</head>
<body>

<div class="container">
    <div class="card">
        <h2>Reset Password</h2>
        <p class="info">
            Create a new strong password for your account.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input 
                type="password" 
                name="new_password" 
                placeholder="New Password" 
                required
            >

            <input 
                type="password" 
                name="confirm_password" 
                placeholder="Confirm Password" 
                required
            >

            <button type="submit">Reset Password</button>
        </form>

        <div class="hint">
            Password must be at least <b>10 characters</b>.
        </div>
    </div>
</div>

</body>
</html>

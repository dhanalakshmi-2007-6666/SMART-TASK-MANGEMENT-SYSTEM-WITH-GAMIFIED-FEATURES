<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at 20% 10%, #1e293b 0%, transparent 40%),
        radial-gradient(circle at 80% 90%, #0f766e 0%, transparent 35%),
        #020617;

      color: #e5e7eb;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.97);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .right-panel {
      width: 420px;
      padding: 35px 32px;

      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(14px);

      border-radius: 22px;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.45),
        inset 0 1px 0 rgba(255,255,255,0.05);

      transition: all 0.3s ease;
    }

    .right-panel:hover {
      transform: translateY(-6px);
      border-color: #38bdf8;
      box-shadow: 0 18px 45px rgba(0,0,0,0.65);
    }

    .right-panel h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 18px;

      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);

      background: rgba(255,255,255,0.04);
      color: #fff;

      font-size: 14px;
      outline: none;
      transition: 0.25s;
    }

    input::placeholder {
      color: #6b7280;
    }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 10px rgba(56,189,248,0.55);
      transform: scale(1.015);
    }

    button {
      width: 100%;
      padding: 12px;

      border: none;
      border-radius: 16px;

      font-size: 15px;
      font-weight: 700;

      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;

      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: "";
      position: absolute;
      width: 120%;
      height: 120%;
      top: -50%;
      left: -50%;
      background: rgba(255,255,255,0.25);
      transform: rotate(45deg) translateX(-100%);
      transition: transform 0.5s ease;
    }

    button:hover::after {
      transform: rotate(45deg) translateX(100%);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.6);
    }

    .success {
      margin-top: 12px;
      text-align: center;
      font-weight: 600;
      color: #4ade80;
    }

    .danger {
      margin-top: 12px;
      text-align: center;
      font-weight: 600;
      color: #f87171;
    }

    .links {
      text-align: center;
      margin-top: 18px;
    }

    .links a {
      text-decoration: none;
      color: #38bdf8;
      font-weight: 600;
      margin: 0 8px;
      transition: 0.3s;
    }

    .links a:hover {
      color: white;
      text-decoration: underline;
    }

    @media(max-width: 600px) {
      .right-panel {
        width: 90%;
        padding: 25px;
      }
    }
  </style>
</head>

<body>
  <div class="right-panel">
    <h1>LOGIN PAGE</h1>
    <p class="subtitle">
      Small tasks completed today build big success tomorrow
    </p>

    <form method="POST" action="{{url_for('login')}}">

      <label for="email">Email</label>
      <input type="email" id="email" name="email"
             placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password"
             placeholder="Enter password" required />

      <button type="submit">Login</button>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <p class="{{ category }}">{{ message }}</p>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <div class="links">
        <p>New User?</p>
        <a href="{{url_for('create')}}">Create Account</a>
        <a href="{{url_for('forgot_reset')}}">Forgot Password?</a>
      </div>

    </form>
  </div>
</body>
</html>

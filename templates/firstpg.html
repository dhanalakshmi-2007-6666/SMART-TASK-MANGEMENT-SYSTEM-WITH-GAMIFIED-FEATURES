<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 20% 10%, #1e293b 0%, transparent 40%),
        radial-gradient(circle at 80% 90%, #0f766e 0%, transparent 35%),
        #020617;
      color: #e5e7eb;
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.97);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .container {
      width: 420px;
      padding: 40px 32px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      border-radius: 22px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      text-align: center;
      transition: all 0.3s ease;
    }

    .container:hover {
      transform: translateY(-6px);
      border-color: #38bdf8;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
    }

    h2 {
      font-size: 22px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 15px;
    }

    .sub-text {
      font-size: 14px;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #1e3a8a, #2563eb);
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button::after {
      content: "";
      position: absolute;
      width: 120%;
      height: 120%;
      top: -50%;
      left: -50%;
      background: rgba(255, 255, 255, 0.25);
      transform: rotate(45deg) translateX(-100%);
      transition: transform 0.5s ease;
    }

    button:hover::after {
      transform: rotate(45deg) translateX(100%);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.6);
    }

    @media (max-width: 600px) {
      .container {
        width: 90%;
        padding: 25px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    
    <h2>Welcome {{username}},</h2>
    <p class="sub-text">How you want to be productive ?</p>

    <form method="POST" action="/set-energy">
      <div class="buttons">
        <button name="energy" value="Low">Personal 👤</button>
        <button name="energy" value="High">Collab 🤝</button>
      </div>
    </form>

  </div>
</body>
</html>

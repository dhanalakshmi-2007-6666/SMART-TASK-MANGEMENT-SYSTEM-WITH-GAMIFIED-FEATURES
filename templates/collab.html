<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Tasks Dashboard</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 40px;

      background:
        radial-gradient(circle at 20% 10%, #1e293b 0%, transparent 40%),
        radial-gradient(circle at 80% 90%, #0f766e 0%, transparent 35%),
        #020617;

      color: #e5e7eb;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 35px;
      font-size: 34px;
      font-weight: 700;
      color: #fff;
    }

    h2 {
      margin: 30px 0 18px;
      font-size: 22px;
      font-weight: 600;
      color: #38bdf8;
    }

    .task-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border-radius: 18px;
      padding: 20px 25px;
      margin-bottom: 18px;

      box-shadow:
        0 10px 25px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);

      transition: all 0.25s ease;
    }

    .task-card:hover {
      transform: translateY(-6px);
      border-color: #38bdf8;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
    }

    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .task-title {
      font-size: 20px;
      font-weight: 600;
      color: #fff;
    }

    .task-dates {
      font-size: 13px;
      color: #9ca3af;
    }

    .task-desc {
      margin-top: 10px;
      font-size: 14px;
      color: #cbd5e1;
      line-height: 1.6;
    }

    .assigned {
      margin-top: 8px;
      font-size: 14px;
      color: #facc15;
      font-weight: 600;
    }

    .task-footer {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .progress-badge {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .pending {
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #f87171;
    }

    .working {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #facc15;
    }

    .completed {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .review-btn {
      background: linear-gradient(135deg, #1e40af, #2563eb);
      color: white;
    }

    .review-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4);
    }

    .delete-btn {
      background: linear-gradient(135deg, #7f1d1d, #dc2626);
      color: white;
    }

    .delete-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px rgba(220, 38, 38, 0.4);
    }

    .no-task {
      text-align: center;
      font-size: 16px;
      color: #9ca3af;
      margin-top: 40px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>🏢 Team Project Dashboard</h1>

  <h2>📌 Company Tasks</h2>

      <div class="task-card">

        <div class="task-header">
          <div class="task-title"></div>
          <div class="task-dates"></div>
        </div>

        <div class="task-desc"></div>

        <div class="assigned">
          👤 Assigned to: 
        </div>

        <div class="task-footer">

          
            <span class="progress-badge pending">⏳ Pending</span>

          
            <span class="progress-badge working">⚡ In Progress</span>

          
            <span class="progress-badge completed">✔ Completed</span>
          

          <a href="" class="btn review-btn">
            🔍 View Progress
          </a>

          <a href="" class="btn delete-btn"
             onclick="return confirm('Delete this task?')">
            🗑 Delete
          </a>

        </div>

      </div>
    
    <p class="no-task">No team tasks assigned 🚫</p>
  

</div>

</body>
</html>
